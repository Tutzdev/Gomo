name: Deploy Gomo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gomo-production
  cancel-in-progress: false

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Backend — build (Maven)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests clean package

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — build (Vite)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    name: Deploy na VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Conferir secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          falta=0
          for v in VPS_HOST VPS_PORT VPS_USER SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "VAZIO -> $v"; falta=1
            else echo "ok    -> $v ($(printf '%s' "${!v}" | wc -c) bytes)"; fi
          done
          [ "$falta" = 0 ] || { echo "Cadastre os secrets em Settings > Environments > production"; exit 1; }

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "chave privada valida"

      # A forced command na VPS so aceita "deploy <sha>"
      - name: Executar deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 \
              "${VPS_USER}@${VPS_HOST}" "deploy ${GITHUB_SHA}"

      - name: Remover chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
