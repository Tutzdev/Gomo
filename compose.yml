services:
  application:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/prices
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SITE_URL: ${SITE_URL:-}
      CONTRIBUTION_SOURCE_ID: ${CONTRIBUTION_SOURCE_ID:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      SUBSCRIBER_BOOTSTRAP_EMAIL: ${SUBSCRIBER_BOOTSTRAP_EMAIL:-}
      OPEN_BETA: "${OPEN_BETA:-true}"
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      PRICE_MAX_AGE: "${PRICE_MAX_AGE:-P2D}"
      PRICE_COLLECTION_ENABLED: "${PRICE_COLLECTION_ENABLED:-true}"
      PRICE_COLLECTION_CRON: "${PRICE_COLLECTION_CRON:-0 30 5 * * *}"
      PRICE_COLLECTION_ZONE: "${PRICE_COLLECTION_ZONE:-America/Sao_Paulo}"
      PRICE_COLLECTION_COLLECTOR_INTERVAL: "${PRICE_COLLECTION_COLLECTOR_INTERVAL:-PT2S}"
      PRICE_COLLECTION_MINIMUM_RATIO: "${PRICE_COLLECTION_MINIMUM_RATIO:-0.20}"
      PRICE_COLLECTION_MAXIMUM_RATIO: "${PRICE_COLLECTION_MAXIMUM_RATIO:-5.00}"
      NAGUMO_COLLECTION_ENABLED: "${NAGUMO_COLLECTION_ENABLED:-true}"
      NAGUMO_BASE_URL: "${NAGUMO_BASE_URL:-https://www.nagumo.com.br}"
      NAGUMO_ADDITIONAL_CATEGORY_IDS: "${NAGUMO_ADDITIONAL_CATEGORY_IDS:-acougue,basicos-e-matinais,bazar,bebidas,frios-e-laticinios,hortifruti,limpeza,padaria,peixaria,pet-shop,mercearia-doce,mercearia-salgada,higiene,jardinagem,orientais}"
      NAGUMO_PAGE_SIZE: "${NAGUMO_PAGE_SIZE:-50}"
      NAGUMO_REQUEST_DELAY: "${NAGUMO_REQUEST_DELAY:-PT1S}"
      NAGUMO_CONNECT_TIMEOUT: "${NAGUMO_CONNECT_TIMEOUT:-PT10S}"
      NAGUMO_REQUEST_TIMEOUT: "${NAGUMO_REQUEST_TIMEOUT:-PT20S}"
      NAGUMO_MAX_ATTEMPTS: "${NAGUMO_MAX_ATTEMPTS:-2}"
      NAGUMO_MAX_RESPONSE_BYTES: "${NAGUMO_MAX_RESPONSE_BYTES:-5000000}"
      ROYAL_COLLECTION_ENABLED: "${ROYAL_COLLECTION_ENABLED:-true}"
      ROYAL_BASE_URL: "${ROYAL_BASE_URL:-https://www.royalsupermercados.com.br}"
      ROYAL_API_URL: "${ROYAL_API_URL:-https://services.vipcommerce.com.br}"
      ROYAL_PUBLIC_CONFIGURATION_PATH: "${ROYAL_PUBLIC_CONFIGURATION_PATH:-/chunk-TLHOSSIT.js}"
      ROYAL_SEARCH_TERMS: "${ROYAL_SEARCH_TERMS:-coca,italac,bauducco,yoki,coracoes}"
      ROYAL_FULL_CATALOG: "${ROYAL_FULL_CATALOG:-true}"
      ROYAL_CONNECT_TIMEOUT: "${ROYAL_CONNECT_TIMEOUT:-PT10S}"
      ROYAL_REQUEST_TIMEOUT: "${ROYAL_REQUEST_TIMEOUT:-PT20S}"
      ROYAL_REQUEST_DELAY: "${ROYAL_REQUEST_DELAY:-PT1S}"
      ROYAL_MAX_ATTEMPTS: "${ROYAL_MAX_ATTEMPTS:-2}"
      ROYAL_MAX_RESPONSE_BYTES: "${ROYAL_MAX_RESPONSE_BYTES:-5000000}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: prices
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prices_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d prices"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  prices_postgres:
