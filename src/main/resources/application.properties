spring.application.name=prices
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful
# Atrás do Nginx: usa X-Forwarded-Proto/Host/For do proxy local para saber o endereço público
# (o login no mesmo domínio não vira CORS) e o IP real de quem acessa (limites por pessoa).
# O Tomcat só aceita esses cabeçalhos vindos de proxies internos (127.0.0.1, redes privadas).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
app.auth.token-ttl=${AUTH_TOKEN_TTL:PT12H}
# Cookie de sessão do site: Secure exige HTTPS. Só o ambiente local em http (perfil development) desliga.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.email-verification-ttl=${EMAIL_VERIFICATION_TTL:P1D}
app.auth.password-reset-ttl=${PASSWORD_RESET_TTL:PT1H}
# Limpeza diária (4h30): sessões e tokens vencidos, contas nunca confirmadas sem uso há 30 dias e o
# contador do plano grátis com mais de 7 dias ("-" desliga).
app.cleanup.cron=${ACCOUNT_CLEANUP_CRON:0 30 4 * * *}
app.cleanup.unverified-account-retention=${UNVERIFIED_ACCOUNT_RETENTION:P30D}
app.cleanup.comparison-usage-retention=${COMPARISON_USAGE_RETENTION:P7D}
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.subscription.bootstrap-email=${SUBSCRIBER_BOOTSTRAP_EMAIL:}
app.contributions.source-id=${CONTRIBUTION_SOURCE_ID:}
app.recommendations.max-stores=${RECOMMENDATION_MAX_STORES:500}
app.alerts.repeat-interval=${ALERT_REPEAT_INTERVAL:P1D}
# Premium alerts may notify on every collection; collections run at least five hours apart.
app.alerts.premium-repeat-interval=${ALERT_PREMIUM_REPEAT_INTERVAL:PT1H}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.rate-limit.registration=${REGISTRATION_RATE_LIMIT:5}
app.rate-limit.login=${LOGIN_RATE_LIMIT:10}
app.rate-limit.account-messages=${ACCOUNT_MESSAGE_RATE_LIMIT:5}
app.rate-limit.contributions=${CONTRIBUTION_RATE_LIMIT:20}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Endereço público do site (ex.: https://gomo.com.br), usado nas URLs absolutas do /api/v1/sitemap.xml.
# Sem ele não há sitemap (404).
app.site-url=${SITE_URL:}
app.prices.max-age=${PRICE_MAX_AGE:P2D}
app.collection.enabled=${PRICE_COLLECTION_ENABLED:true}
app.collection.existing-only=${PRICE_COLLECTION_EXISTING_ONLY:true}
# Servidor novo (sem nenhum preço): carrega as coletas incluídas no app antes da primeira atualização.
app.collection.seed-when-empty=${PRICE_COLLECTION_SEED_WHEN_EMPTY:true}
# Prices are refreshed four times a day; a startup refresh covers a machine that was switched off.
app.collection.cron=${PRICE_COLLECTION_CRON:0 0 6,11,16,21 * * *}
# Weekly full import: new products launched by the markets enter the catalog ("-" turns it off).
app.collection.full-cron=${PRICE_COLLECTION_FULL_CRON:0 0 3 * * SUN}
app.collection.refresh-when-older-than=${PRICE_REFRESH_WHEN_OLDER_THAN:PT8H}
# A market without new prices for this long is reported as late by /api/v1/status/collections.
app.collection.stale-after=${PRICE_COLLECTION_STALE_AFTER:PT12H}
app.catalog.min-stores=${CATALOG_MIN_STORES:2}
app.catalog.rebuild-on-start=${CATALOG_REBUILD_ON_START:true}
app.collection.zone=${PRICE_COLLECTION_ZONE:America/Sao_Paulo}
app.collection.collector-interval=${PRICE_COLLECTION_COLLECTOR_INTERVAL:PT2S}
# Collectors download from different sites at the same time; database writes stay sequential.
app.collection.parallelism=${PRICE_COLLECTION_PARALLELISM:3}
# A promotion published without an end date counts as the current price for this long after the collection.
app.collection.undated-promotion-window=${PRICE_UNDATED_PROMOTION_WINDOW:PT12H}
app.collection.price.minimum-ratio=${PRICE_COLLECTION_MINIMUM_RATIO:0.20}
app.collection.price.maximum-ratio=${PRICE_COLLECTION_MAXIMUM_RATIO:5.00}
app.collection.nagumo.enabled=${NAGUMO_COLLECTION_ENABLED:true}
app.collection.nagumo.base-url=${NAGUMO_BASE_URL:https://www.nagumo.com.br}
app.collection.nagumo.store-id=36
app.collection.nagumo.store-name=036-V.REDONDA
app.collection.nagumo.expected-city=VOLTA REDONDA
app.collection.nagumo.expected-district=PONTE ALTA
app.collection.nagumo.expected-source-address=VIA SERGIO BRAGA, PONTE ALTA, VOLTA REDONDA, RJ
app.collection.nagumo.address=Via Sergio Braga, 951 - Ponte Alta - Volta Redonda/RJ - CEP 27265-601
app.collection.nagumo.latitude=-22.5295573
app.collection.nagumo.longitude=-44.1360020
app.collection.nagumo.category-id=MP-GERAL
app.collection.nagumo.additional-category-ids=${NAGUMO_ADDITIONAL_CATEGORY_IDS:acougue,basicos-e-matinais,bazar,bebidas,frios-e-laticinios,hortifruti,limpeza,padaria,peixaria,pet-shop,mercearia-doce,mercearia-salgada,higiene,jardinagem,orientais}
app.collection.nagumo.promotion-flag=NGM_36_M
# The storefront answers 200 items as fast as 50, so larger pages cut the number of requests by four.
app.collection.nagumo.page-size=${NAGUMO_PAGE_SIZE:200}
app.collection.nagumo.request-delay=${NAGUMO_REQUEST_DELAY:PT1S}
app.collection.nagumo.connect-timeout=${NAGUMO_CONNECT_TIMEOUT:PT10S}
app.collection.nagumo.request-timeout=${NAGUMO_REQUEST_TIMEOUT:PT20S}
app.collection.nagumo.max-attempts=${NAGUMO_MAX_ATTEMPTS:2}
app.collection.nagumo.max-response-bytes=${NAGUMO_MAX_RESPONSE_BYTES:5000000}
app.collection.nagumo.zone=${PRICE_COLLECTION_ZONE:America/Sao_Paulo}
springdoc.swagger-ui.enabled=false
app.collection.royal.enabled=${ROYAL_COLLECTION_ENABLED:true}
app.collection.royal.base-url=${ROYAL_BASE_URL:https://www.royalsupermercados.com.br}
app.collection.royal.api-url=${ROYAL_API_URL:https://services.vipcommerce.com.br}
app.collection.royal.public-configuration-path=${ROYAL_PUBLIC_CONFIGURATION_PATH:/chunk-TLHOSSIT.js}
app.collection.royal.search-terms=${ROYAL_SEARCH_TERMS:coca,italac,bauducco,yoki,coracoes}
app.collection.royal.full-catalog=${ROYAL_FULL_CATALOG:true}
app.collection.royal.connect-timeout=${ROYAL_CONNECT_TIMEOUT:PT10S}
app.collection.royal.request-timeout=${ROYAL_REQUEST_TIMEOUT:PT20S}
app.collection.royal.request-delay=${ROYAL_REQUEST_DELAY:PT1S}
app.collection.royal.max-attempts=${ROYAL_MAX_ATTEMPTS:2}
app.collection.royal.max-response-bytes=${ROYAL_MAX_RESPONSE_BYTES:5000000}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# Sentry só liga com SENTRY_DSN (e SENTRY_ENVIRONMENT opcional), sem dados pessoais e sem rastreamento de desempenho.
sentry.send-default-pii=false
# Premium pago pela AbacatePay (API v2). Desligado até as chaves existirem; a chave de API define o ambiente
# (Dev mode ou produção) e ABACATEPAY_DEV_MODE precisa combinar com ela.
app.billing.abacatepay.enabled=${ABACATEPAY_ENABLED:false}
app.billing.abacatepay.api-key=${ABACATEPAY_API_KEY:}
app.billing.abacatepay.webhook-secret=${ABACATEPAY_WEBHOOK_SECRET:}
app.billing.abacatepay.monthly-product-id=${ABACATEPAY_MONTHLY_PRODUCT_ID:}
app.billing.abacatepay.annual-product-id=${ABACATEPAY_ANNUAL_PRODUCT_ID:}
app.billing.abacatepay.site-url=${ABACATEPAY_SITE_URL:}
app.billing.abacatepay.dev-mode=${ABACATEPAY_DEV_MODE:false}
app.billing.abacatepay.methods=${ABACATEPAY_METHODS:CARD}
