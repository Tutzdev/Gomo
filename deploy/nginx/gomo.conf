# Nginx do Gomo na VPS. Veja docs/operations.md, item 1.
#
# Instalar (como root, a partir do clone em /var/www/gomo):
#   sed 's/gomo.example.com/SEU_DOMINIO/g' deploy/nginx/gomo.conf > /etc/nginx/sites-available/gomo
#   ln -sf /etc/nginx/sites-available/gomo /etc/nginx/sites-enabled/gomo
#   nginx -t && systemctl reload nginx
#
# O arquivo é incluído dentro do bloco http {} (sites-enabled), por isso as zonas de limite ficam aqui no topo.

# Limites por IP. A API pública (catálogo, preços, produtos, mercados) aguenta a navegação normal com folga:
# uma tela faz de 3 a 10 pedidos e a rajada de 60 absorve listas grandes, mas baixar o catálogo inteiro fica
# lento. Entrar, criar conta e pedir e-mail têm um limite bem menor, que continua valendo depois de um deploy
# (o limite da própria API fica em memória e zera quando ela reinicia).
limit_req_zone $binary_remote_addr zone=gomo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gomo_auth:10m rate=20r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    listen [::]:80;
    server_name gomo.example.com www.gomo.example.com;

    # Renovação do certificado pelo certbot (webroot); todo o resto vai para HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://gomo.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gomo.example.com;

    ssl_certificate     /etc/letsencrypt/live/gomo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gomo.example.com/privkey.pem;

    return 301 https://gomo.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gomo.example.com;

    ssl_certificate     /etc/letsencrypt/live/gomo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gomo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gomo_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança, em todas as respostas (always: também nos erros).
    # Atenção: um add_header dentro de um location apaga todos estes naquele location. Por isso os locations
    # abaixo usam "expires" para cache, nunca add_header.
    #
    # CSP: o site só roda scripts próprios. Fontes do Google Fonts (CSS em fonts.googleapis.com, arquivos em
    # fonts.gstatic.com). Fotos dos produtos vêm dos sites dos mercados, em vários domínios que mudam: qualquer
    # imagem https é aceita (imagem não executa código). 'unsafe-inline' em style-src cobre os <style> que os
    # componentes de diálogo injetam. Sentry opcional: os domínios de ingestão já estão em connect-src.
    # Analytics opcional (VITE_ANALYTICS_SCRIPT_URL): acrescente o domínio do script em script-src e em
    # connect-src, por exemplo https://plausible.io.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    # Um ano, só este domínio. includeSubDomains/preload só quando todos os subdomínios tiverem HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Os links de confirmação de e-mail e de nova senha levam o token na URL: para outros sites vai só a origem.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A rota entre mercados usa a localização, só no próprio site.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;

    root /var/www/gomo/frontend/dist;
    index index.html;

    # Arquivos do build com hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # O app é uma SPA: qualquer caminho que não é arquivo abre o index.html, que nunca fica em cache.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos repassados para a API. Ela confia neles só porque vêm de 127.0.0.1 (veja docs/operations.md):
    # o IP real limita tentativas por pessoa e Proto/Host fazem o cookie __Host- e a checagem de Origin
    # funcionarem. X-Forwarded-For recebe só o IP de quem conectou, nunca o que o cliente mandou.
    # A API também manda X-Frame-Options, X-Content-Type-Options e HSTS; os do Nginx (acima) valem, sem repetir.
    location /api/ {
        limit_req zone=gomo_api burst=60 nodelay;
        include /etc/nginx/gomo-proxy.conf;
    }

    location /api/v1/auth/ {
        limit_req zone=gomo_auth burst=10 nodelay;
        include /etc/nginx/gomo-proxy.conf;
    }

    # O site confere a sessão em toda página aberta: segue o limite geral, não o de login.
    location = /api/v1/auth/session {
        limit_req zone=gomo_api burst=60 nodelay;
        include /etc/nginx/gomo-proxy.conf;
    }

    # O webhook do pagamento vem dos servidores da AbacatePay, que podem mandar vários eventos juntos.
    location = /api/v1/billing/abacatepay/webhook {
        include /etc/nginx/gomo-proxy.conf;
    }
}
