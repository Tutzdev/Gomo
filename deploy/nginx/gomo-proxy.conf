# Repasse para a API do Gomo, incluído pelos locations /api/ de gomo.conf.
# Instalar em /etc/nginx/gomo-proxy.conf (veja docs/operations.md, item 1).
proxy_pass http://127.0.0.1:8087;
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_read_timeout 60s;

# Valem os cabeçalhos de segurança do server em gomo.conf; sem isso iriam duplicados.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Strict-Transport-Security;
